global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: banking-account
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [banking-dev]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app], regex: banking-account, action: keep}
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
      - {source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep}
      - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: http, action: keep}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
  - job_name: banking-payment
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [banking-dev]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app], regex: banking-payment, action: keep}
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
      - {source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep}
      - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: http, action: keep}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
