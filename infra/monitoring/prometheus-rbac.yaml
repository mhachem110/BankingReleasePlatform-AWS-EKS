# Proposal only. Approved operator installs namespace-scoped monitoring access after review.
apiVersion: v1
kind: ServiceAccount
metadata: {name: banking-prometheus, namespace: banking-dev}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: banking-prometheus-discovery, namespace: banking-dev}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: banking-prometheus-discovery, namespace: banking-dev}
subjects:
  - {kind: ServiceAccount, name: banking-prometheus, namespace: banking-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: banking-prometheus-discovery}
