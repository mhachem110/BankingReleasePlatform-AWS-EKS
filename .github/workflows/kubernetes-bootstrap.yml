# Internal Infra CI/CD stage: install only reviewed Banking namespaces and RBAC.
# CodeBuild creates one ephemeral VPC-connected runner for this protected job.
name: Banking Kubernetes bootstrap
on:
  workflow_call:
    inputs:
      platform_interface_json:
        type: string
        required: true
      runtime_interface_json:
        type: string
        required: true
      dev_data_interface_json:
        type: string
        required: true
      prod_data_interface_json:
        type: string
        required: true
    outputs:
      verified:
        value: ${{ jobs.apply.outputs.verified }}
permissions:
  contents: read
concurrency:
  group: banking-kubernetes-bootstrap
  cancel-in-progress: false
jobs:
  apply:
    if: >-
      github.ref == 'refs/heads/dev' && vars.AWS_OPERATIONS_ENABLED == 'true' &&
      fromJSON(inputs.platform_interface_json || '{}').verified == true
    runs-on: codebuild-banking-release-deployer-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 25
    environment: bootstrap # Keep the existing human reviewer gate.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      BANKING_OPERATOR_ROLE_ARN: arn:aws:iam::866934333672:role/cloudbatch818-mahmoud-banking-operator
      PLATFORM_INTERFACE_JSON: ${{ inputs.platform_interface_json }}
      RUNTIME_INTERFACE_JSON: ${{ inputs.runtime_interface_json }}
      DEV_DATA_INTERFACE_JSON: ${{ inputs.dev_data_interface_json }}
      PROD_DATA_INTERFACE_JSON: ${{ inputs.prod_data_interface_json }}
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned kubectl and related release tools
        run: python scripts/deploy/install-tools.py
      - name: Install pinned PostgreSQL client for TLS migrations
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - id: cap
        name: Restrict operator AWS session to the two verified RDS secrets
        run: python scripts/infra/operator_cap.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::866934333672:role/cloudbatch818-mahmoud-banking-operator
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-kubernetes-bootstrap
          inline-session-policy: ${{ steps.cap.outputs.session_policy }}
          unset-current-credentials: true
      - name: Install namespaces, quotas and exact dev/prod release roles
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/infra/kubernetes_bootstrap.py preflight
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          aws eks update-kubeconfig --name banking-dev --region "$AWS_REGION"
          kubectl rollout status deployment/coredns -n kube-system --timeout=10m
          kubectl apply --server-side -f helm/banking/namespaces/banking-dev.yaml
          kubectl apply --server-side -f helm/banking/namespaces/banking-prod.yaml
          kubectl apply --server-side -f helm/banking/namespaces/aws-observability.yaml
          kubectl apply --server-side -f iam/phase3/deployer-verification-rbac.yaml
          python scripts/infra/install_controller.py
          python scripts/infra/prepare_database.py
          python scripts/infra/kubernetes_bootstrap.py verify
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-kubernetes-bootstrap-evidence
          path: |
            controller-verification.json
            database-bootstrap-verification.json
            kubernetes-bootstrap-verification.json
          if-no-files-found: error
          retention-days: 7
