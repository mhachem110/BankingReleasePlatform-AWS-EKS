name: Deploy approved application digest
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment
        type: choice
        options: [dev, stage, uat, prod]
        default: dev
        required: true
      publish_run_id:
        description: Successful reviewed-dev app-publish workflow run ID (same for every promotion)
        type: string
        required: true
      authorization:
        description: Explicit approval for application deployment on existing infrastructure
        type: choice
        options: [disabled, approved]
        default: disabled
        required: true
permissions:
  contents: read
concurrency:
  group: banking-deployment-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      inputs.authorization == 'approved' &&
      ((inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
       (inputs.environment == 'stage' && github.ref == 'refs/heads/stage') ||
       (inputs.environment == 'uat' && github.ref == 'refs/heads/uat') ||
       (inputs.environment == 'prod' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, linux, x64, banking-deployer]
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
      APP_DEPLOYMENTS_ENABLED: ${{ vars.APP_DEPLOYMENTS_ENABLED }}
      APP_DEPLOY_ROLE_ARN: ${{ vars.APP_DEPLOY_ROLE_ARN }}
      INFRA_ROLE_ARN: ${{ vars.INFRA_ROLE_ARN }}
      BOOTSTRAP_ROLE_ARN: ${{ vars.BOOTSTRAP_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_ACCOUNT_REPOSITORY: ${{ vars.ECR_ACCOUNT_REPOSITORY }}
      ECR_PAYMENT_REPOSITORY: ${{ vars.ECR_PAYMENT_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/deploy/preflight.py --environment "$DEPLOY_ENV"
      - run: python scripts/deploy/install-tools.py
      - name: Verify publication and promotion evidence
        run: python scripts/deploy/provenance.py --environment "$DEPLOY_ENV" --run-id "$PUBLISH_RUN_ID"
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: banking-app-deploy-${{ github.run_id }}
      - name: Authenticate to existing ECR
        shell: bash
        run: |
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Rescan exact published digests before deployment
        run: python scripts/deploy/scan.py --manifest release/release.json
      - name: Deploy verify and roll back on failure
        run: python scripts/deploy/deploy.py --environment "$DEPLOY_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ inputs.environment }}-${{ inputs.publish_run_id }}
          path: release/deployment.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-trivy-reports
          path: artifacts/application/scanned/reports
          retention-days: 90
      - name: Clear Docker registry credentials
        if: always()
        shell: bash
        run: docker logout "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
