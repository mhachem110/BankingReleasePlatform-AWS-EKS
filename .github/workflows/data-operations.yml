name: Protected Banking data services
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        description: 'Separate Phase 6 plan; apply requires same-run saved-plan/cost review'
      approval:
        type: string
        default: ''
        description: 'Apply only: APPLY-REVIEWED-PHASE6-PLAN'
permissions:
  contents: read
concurrency:
  group: banking-dev-data
  cancel-in-progress: false
env:
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
jobs:
  prerequisites:
    if: github.ref == 'refs/heads/dev' && vars.AWS_OPERATIONS_ENABLED == 'true' && vars.DATA_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bootstrap/check-github-environment.py
  plan:
    needs: prerequisites
    runs-on: ubuntu-latest
    environment: bootstrap
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      BOOTSTRAP_STATE_READY: ${{ vars.BOOTSTRAP_STATE_READY }}
      AWS_OPERATIONS_ENABLED: ${{ vars.AWS_OPERATIONS_ENABLED }}
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DATA_OPERATIONS_ENABLED: ${{ vars.DATA_OPERATIONS_ENABLED }}
      DATA_INPUTS_JSON: ${{ vars.DATA_INPUTS_JSON }}
      DATA_COST_REVIEW_JSON: ${{ vars.DATA_COST_REVIEW_JSON }}
      DATA_SESSION_POLICY_ARN: ${{ vars.DATA_SESSION_POLICY_ARN }}
      DATA_SESSION_POLICY_SHA256: ${{ vars.DATA_SESSION_POLICY_SHA256 }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/infra/data_guard.py inputs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-phase6-plan
          managed-session-policies: ${{ vars.DATA_SESSION_POLICY_ARN }}
          unset-current-credentials: true
          translate-env-variables: false
      - run: python scripts/infra/data_preflight.py
      - run: python scripts/bootstrap/verify-state-bucket.py --bucket "$TF_STATE_BUCKET" --account "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Save full creation-only data plan
        run: |
          set -euo pipefail
          root=infra/environments/dev/data
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/data.tfbackend.json"
          [[ "$(terraform -chdir="$root" workspace show)" == default ]]
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -lock-timeout=5m -var-file="$GITHUB_WORKSPACE/data.tfvars.json" -out="$GITHUB_WORKSPACE/data.tfplan"
          terraform -chdir="$root" show -json "$GITHUB_WORKSPACE/data.tfplan" > data-plan.json
          python scripts/infra/data_guard.py plan
          terraform -chdir="$root" show -no-color "$GITHUB_WORKSPACE/data.tfplan" > data-plan.txt
      - id: hash
        run: echo "digest=$(sha256sum data.tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-phase6-reviewed-plan
          path: |
            data.tfplan
            data.tfbackend.json
            data.tfvars.json
            data-cost-review.json
            data-prerequisites.json
            data-plan-review.json
            data-plan.txt
          retention-days: 1
          if-no-files-found: error
      - run: echo 'Review the actual 21-entry saved plan, digest, approved data policy, costs and existing Phase 3 interface before the separate apply approval.' >> "$GITHUB_STEP_SUMMARY"
  apply:
    if: inputs.operation == 'apply' && inputs.approval == 'APPLY-REVIEWED-PHASE6-PLAN'
    needs: [prerequisites, plan]
    runs-on: ubuntu-latest
    environment: bootstrap
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      BOOTSTRAP_STATE_READY: ${{ vars.BOOTSTRAP_STATE_READY }}
      AWS_OPERATIONS_ENABLED: ${{ vars.AWS_OPERATIONS_ENABLED }}
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DATA_OPERATIONS_ENABLED: ${{ vars.DATA_OPERATIONS_ENABLED }}
      DATA_INPUTS_JSON: ${{ vars.DATA_INPUTS_JSON }}
      DATA_COST_REVIEW_JSON: ${{ vars.DATA_COST_REVIEW_JSON }}
      DATA_SESSION_POLICY_ARN: ${{ vars.DATA_SESSION_POLICY_ARN }}
      DATA_SESSION_POLICY_SHA256: ${{ vars.DATA_SESSION_POLICY_SHA256 }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
      REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/infra/data_guard.py inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banking-phase6-reviewed-plan
          path: reviewed
      - name: Verify same-run plan, inputs, backend and cost review
        run: |
          set -euo pipefail
          echo "$REVIEWED_DIGEST  reviewed/data.tfplan" | sha256sum --check --strict
          cmp data.tfvars.json reviewed/data.tfvars.json
          cmp data.tfbackend.json reviewed/data.tfbackend.json
          cmp data-cost-review.json reviewed/data-cost-review.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-phase6-apply
          managed-session-policies: ${{ vars.DATA_SESSION_POLICY_ARN }}
          unset-current-credentials: true
          translate-env-variables: false
      - run: python scripts/infra/data_preflight.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Reaudit and apply only the reviewed binary
        run: |
          set -euo pipefail
          root=infra/environments/dev/data
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/reviewed/data.tfbackend.json"
          [[ "$(terraform -chdir="$root" workspace show)" == default ]]
          terraform -chdir="$root" show -json "$GITHUB_WORKSPACE/reviewed/data.tfplan" > data-plan.json
          cp reviewed/data.tfplan data.tfplan
          python scripts/infra/data_guard.py plan
          cmp data-plan-review.json reviewed/data-plan-review.json
          terraform -chdir="$root" apply -input=false -lock-timeout=5m "$GITHUB_WORKSPACE/reviewed/data.tfplan"
          terraform -chdir="$root" output -json > data-outputs.json
          python scripts/infra/data_verify.py
          terraform -chdir="$root" plan -input=false -lock-timeout=5m -detailed-exitcode -var-file="$GITHUB_WORKSPACE/reviewed/data.tfvars.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-data-verified-interface
          path: |
            data-outputs.json
            data-verification.json
          retention-days: 7
          if-no-files-found: error
