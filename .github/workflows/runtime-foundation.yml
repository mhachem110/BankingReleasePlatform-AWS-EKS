# Reusable stage: launch through Infra CI/CD on reviewed dev.
# Same reviewed-dev OIDC model; plan is read-only, apply pauses for a second review.
name: Reviewed Banking runtime foundation
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      approval:
        type: string
        required: true
      enabled:
        type: boolean
        default: false
    outputs:
      interface_json:
        description: Verified actual key and operator; empty until a creation plan is applied
        value: ${{ jobs.apply.outputs.interface_json || jobs.plan.outputs.interface_json }}
permissions:
  contents: read
concurrency:
  group: banking-shared-iam-prerequisites
  cancel-in-progress: false
env:
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
jobs:
  prerequisites:
    if: github.ref == 'refs/heads/dev' && vars.AWS_OPERATIONS_ENABLED == 'true' && (inputs.enabled || vars.RUNTIME_FOUNDATION_ENABLED == 'true') && vars.CLEANUP_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bootstrap/check-github-environment.py
  plan:
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
    env: &foundation-env
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      BOOTSTRAP_STATE_READY: ${{ vars.BOOTSTRAP_STATE_READY }}
      AWS_OPERATIONS_ENABLED: ${{ vars.AWS_OPERATIONS_ENABLED }}
      RUNTIME_FOUNDATION_ENABLED: ${{ inputs.enabled && 'true' || vars.RUNTIME_FOUNDATION_ENABLED }}
      CLEANUP_ENABLED: ${{ vars.CLEANUP_ENABLED }}
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
      apply_required: ${{ steps.plan-review.outputs.apply_required }}
      interface_json: ${{ steps.status.outputs.interface_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: config
        run: python scripts/infra/runtime_foundation.py inputs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-runtime-foundation-plan
          inline-session-policy: ${{ steps.config.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - id: status
        run: python scripts/infra/runtime_foundation.py preflight
      - name: Verify protected existing state bucket
        run: python scripts/bootstrap/verify-state-bucket.py --bucket "$TF_STATE_BUCKET" --account "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Save the exact five-resource key and operator creation plan
        run: |
          set -euo pipefail
          root=infra/runtime-foundation
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/foundation.tfbackend.json"
          [[ "$(terraform -chdir="$root" workspace show)" == default ]]
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -lock-timeout=5m -out="$GITHUB_WORKSPACE/foundation.tfplan"
          terraform -chdir="$root" show -json "$GITHUB_WORKSPACE/foundation.tfplan" > foundation-plan.json
          terraform -chdir="$root" show -no-color "$GITHUB_WORKSPACE/foundation.tfplan" > foundation-plan.txt
      - id: plan-review
        run: python scripts/infra/runtime_foundation.py plan
      - id: hash
        run: echo "digest=$(sha256sum foundation.tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-runtime-foundation-reviewed-plan
          path: |
            foundation.tfplan
            foundation.tfbackend.json
            foundation-config.json
            foundation-plan-review.json
            foundation-plan.txt
            foundation-preflight.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish key and operator review instructions
        if: steps.plan-review.outputs.apply_required == 'true'
        run: |
          echo 'Review the new symmetric rotated KMS key, its policy and alias, the restricted operator role/trust, exact ownership and saved-plan SHA256. One key costs USD 1/month, hourly prorated, plus requests and future rotations. No existing keys or bootstrap IAM are changed; this plan creates no EKS, NAT, runner or databases.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record verified foundation reuse
        if: steps.plan-review.outputs.apply_required != 'true'
        run: echo 'Foundation is unchanged. The protected apply job will reverify the live key and operator without requesting a write session.' >> "$GITHUB_STEP_SUMMARY"
  apply:
    # A no-op plan still enters this protected job to reverify the owned key and
    # operator. The write session and Terraform apply remain creation-only.
    if: inputs.operation == 'apply' && inputs.approval == 'APPLY-REVIEWED-BANKING-FOUNDATION'
    needs: [prerequisites, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
      actions: read
    env: *foundation-env
    outputs:
      interface_json: ${{ steps.verify.outputs.interface_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: config
        run: python scripts/infra/runtime_foundation.py inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banking-runtime-foundation-reviewed-plan
          path: reviewed
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-runtime-foundation-inspect
          inline-session-policy: ${{ steps.config.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Recheck authorization and the same-run reviewed binary
        env:
          REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
        run: |
          set -euo pipefail
          python scripts/infra/runtime_foundation.py preflight
          terraform -chdir=infra/runtime-foundation init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/foundation.tfbackend.json"
          [[ "$(terraform -chdir=infra/runtime-foundation workspace show)" == default ]]
          terraform -chdir=infra/runtime-foundation show -json "$GITHUB_WORKSPACE/reviewed/foundation.tfplan" > foundation-plan.json
          python scripts/infra/runtime_foundation.py saved
      # Only after the saved plan is reviewed do we request the bounded write session.
      - id: write-cap
        if: needs.plan.outputs.apply_required == 'true'
        run: python scripts/infra/runtime_foundation.py write-cap
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: needs.plan.outputs.apply_required == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-runtime-foundation-apply
          inline-session-policy: ${{ steps.write-cap.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - name: Apply the saved plan, verify live key and operator and require zero drift
        id: verify
        env:
          APPLY_REQUIRED: ${{ needs.plan.outputs.apply_required }}
        run: |
          set -euo pipefail
          python scripts/infra/runtime_foundation.py preflight
          if [[ "$APPLY_REQUIRED" == true ]]; then
            terraform -chdir=infra/runtime-foundation apply -input=false -lock-timeout=5m "$GITHUB_WORKSPACE/reviewed/foundation.tfplan"
          fi
          terraform -chdir=infra/runtime-foundation output -json > foundation-outputs.json
          python scripts/infra/runtime_foundation.py verify
          terraform -chdir=infra/runtime-foundation plan -input=false -lock-timeout=5m -detailed-exitcode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-runtime-foundation-verification
          path: |
            foundation-verification.json
            foundation-outputs.json
          retention-days: 7
          if-no-files-found: error
