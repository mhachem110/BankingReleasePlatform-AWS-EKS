name: Read-only Banking AWS reconciliation
on:
  workflow_dispatch:
    inputs:
      inspection:
        type: choice
        options: [disabled, approved-read-only]
        default: disabled
        description: Inspect IAM and existing AWS prerequisites only; never plan or provision
permissions:
  contents: read
concurrency:
  group: banking-read-only-reconciliation
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/dev' && inputs.inspection == 'approved-read-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: '866934333672'
          audience: sts.amazonaws.com
          role-session-name: banking-read-only-audit
          unset-current-credentials: true
          translate-env-variables: false
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["sts:GetCallerIdentity","iam:GetRole","iam:ListRolePolicies","iam:GetRolePolicy","iam:ListAttachedRolePolicies","iam:GetPolicy","iam:GetPolicyVersion","organizations:ListPoliciesForTarget","organizations:ListParents","organizations:DescribePolicy","eks:DescribeCluster","eks:ListClusters","eks:DescribeClusterVersions","eks:DescribeAddonVersions","eks:DescribeAddonConfiguration","ec2:DescribeVpcs","ec2:DescribeAvailabilityZones","servicequotas:ListServiceQuotas","kms:DescribeKey","kms:GetKeyPolicy","kms:ListGrants"],"Resource":"*"}]}
      - name: Collect complete role policy versions and denies visible to the auditor
        run: python scripts/infra/audit-deployment-roles.py
      - name: Inspect existing service and catalog prerequisites without a Terraform operation
        env:
          PLATFORM_INPUTS_JSON: ${{ vars.PLATFORM_INPUTS_JSON }}
        run: python scripts/infra/inspect-prerequisites.py
      - name: Report denied reads and unresolved deployment gates
        run: python scripts/infra/reconcile-evidence.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: banking-read-only-reconciliation
          path: artifacts/final-execution
          retention-days: 7
          if-no-files-found: error
