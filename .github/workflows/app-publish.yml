name: Internal application publication
on:
  workflow_call:
    inputs:
      authorization:
        description: Explicit approval passed by App CD
        type: string
        default: disabled
        required: false
permissions:
  contents: read
concurrency:
  group: banking-application-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/dev' && inputs.authorization == 'approved'
    uses: ./.github/workflows/app-validation.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/dev' && inputs.authorization == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      APP_DEPLOYMENTS_ENABLED: ${{ vars.APP_DEPLOYMENTS_ENABLED }}
      APP_RELEASE_MODE: ${{ vars.APP_RELEASE_MODE }}
      APP_DEPLOY_ROLE_ARN: ${{ vars.APP_DEPLOY_ROLE_ARN }}
      INFRA_ROLE_ARN: ${{ vars.INFRA_ROLE_ARN }}
      BOOTSTRAP_ROLE_ARN: ${{ vars.BOOTSTRAP_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_ACCOUNT_REPOSITORY: ${{ vars.ECR_ACCOUNT_REPOSITORY }}
      ECR_PAYMENT_REPOSITORY: ${{ vars.ECR_PAYMENT_REPOSITORY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: config
        run: python scripts/deploy/preflight.py --environment dev --publishing
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: scanned-images
          path: artifacts/application/scanned
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          inline-session-policy: ${{ steps.config.outputs.session_policy }}
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: banking-app-publish-${{ github.run_id }}
      - run: python scripts/deploy/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release/release.json
          if-no-files-found: error
          retention-days: 90
