name: Terraform validation
on:
  workflow_call:
  pull_request:
    branches: [dev, stage, uat, main]
    paths:
      - 'infra/**'
      - 'iam/**'
      - 'docs/infrastructure/**'
      - 'scripts/bootstrap/**'
      - 'scripts/infra/**'
      - 'scripts/governance/**'
      - 'docs/governance/**'
      - 'AGENTS.md'
      - 'helm/**'
      - '.github/workflows/infra-operations.yml'
      - '.github/workflows/iam-prerequisites.yml'
      - '.github/workflows/policy-prerequisites.yml'
      - '.github/workflows/runtime-foundation.yml'
      - '.github/workflows/runtime-prerequisites.yml'
      - '.github/workflows/kubernetes-bootstrap.yml'
      - '.github/workflows/runner-operations.yml'
      - '.github/workflows/project-deploy.yml'
      - '.github/workflows/platform-caps.yml'
      - '.github/workflows/network-prerequisites.yml'
      - '.github/workflows/data-operations.yml'
      - '.github/workflows/verify-prerequisites.yml'
      - '.github/workflows/terraform-*.yml'
  push:
    branches: [dev, stage, uat, main]
    paths:
      - 'infra/**'
      - 'iam/**'
      - 'docs/infrastructure/**'
      - 'scripts/bootstrap/**'
      - 'scripts/infra/**'
      - 'scripts/governance/**'
      - 'docs/governance/**'
      - 'AGENTS.md'
      - 'helm/**'
      - '.github/workflows/infra-operations.yml'
      - '.github/workflows/iam-prerequisites.yml'
      - '.github/workflows/policy-prerequisites.yml'
      - '.github/workflows/runtime-foundation.yml'
      - '.github/workflows/runtime-prerequisites.yml'
      - '.github/workflows/kubernetes-bootstrap.yml'
      - '.github/workflows/runner-operations.yml'
      - '.github/workflows/project-deploy.yml'
      - '.github/workflows/platform-caps.yml'
      - '.github/workflows/network-prerequisites.yml'
      - '.github/workflows/data-operations.yml'
      - '.github/workflows/verify-prerequisites.yml'
      - '.github/workflows/terraform-*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate configurations without backend or AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the large provider within this job. Read-only lock files still
          # verify its checksums; no Terraform states or credentials are cached.
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/banking-provider-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for root in infra/modules/state-bucket infra/bootstrap infra/environments/dev infra/modules/network infra/modules/vpc-seed infra/network-seed infra/cleanup infra/policy-prerequisites infra/runtime-foundation infra/runtime-prerequisites infra/platform-caps infra/modules/registry infra/modules/eks infra/environments/dev/platform infra/runner infra/iam-prerequisites infra/modules/data-services infra/environments/dev/data infra/environments/prod/data; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra/modules/state-bucket test
          for root in infra/modules/network infra/network-seed infra/policy-prerequisites infra/runtime-foundation infra/platform-caps infra/modules/registry infra/modules/eks infra/environments/dev/platform infra/iam-prerequisites infra/modules/data-services infra/environments/dev/data infra/environments/prod/data; do
            terraform -chdir="$root" test
          done
          python -m unittest discover -s scripts/bootstrap/tests -v
          python -m unittest discover -s scripts/governance/tests -v
          python -m pip install -r scripts/infra/requirements.txt
          python -m unittest discover -s scripts/infra/tests -v
          python scripts/infra/validate-provisioner-policies.py
      - name: Install checksum-pinned Helm and workflow validation tools
        run: python scripts/deploy/install-tools.py
      - name: Validate infrastructure and application workflows
        run: |
          actionlint -config-file scripts/deploy/actionlint.yaml .github/workflows/verify-prerequisites.yml .github/workflows/infra-operations.yml .github/workflows/iam-prerequisites.yml .github/workflows/policy-prerequisites.yml .github/workflows/runtime-foundation.yml .github/workflows/runtime-prerequisites.yml .github/workflows/runner-operations.yml .github/workflows/kubernetes-bootstrap.yml .github/workflows/platform-caps.yml .github/workflows/project-deploy.yml .github/workflows/network-prerequisites.yml .github/workflows/data-operations.yml .github/workflows/terraform-cleanup.yml .github/workflows/terraform-validation.yml .github/workflows/terraform-operations.yml .github/workflows/branch-governance.yml .github/workflows/app-ci.yml .github/workflows/app-validation.yml .github/workflows/app-publish.yml .github/workflows/app-deploy.yml .github/workflows/app-rollback.yml
      - name: Helm lint, rendering and workload safety tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts/deploy/tests -v
      - name: Checkov static scan
        run: |
          python -m pip install checkov==3.3.17
          checkov --directory infra --framework terraform --download-external-modules false
