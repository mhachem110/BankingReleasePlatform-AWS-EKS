name: Terraform validation
on:
  pull_request:
    branches: [dev, stage, uat, main]
    paths:
      - 'infra/**'
      - 'iam/**'
      - 'docs/infrastructure/**'
      - 'scripts/bootstrap/**'
      - 'scripts/infra/**'
      - 'scripts/governance/**'
      - 'docs/governance/**'
      - 'AGENTS.md'
      - 'helm/**'
      - '.github/workflows/infra-operations.yml'
      - '.github/workflows/terraform-*.yml'
  push:
    branches: [dev, stage, uat, main]
    paths:
      - 'infra/**'
      - 'iam/**'
      - 'docs/infrastructure/**'
      - 'scripts/bootstrap/**'
      - 'scripts/infra/**'
      - 'scripts/governance/**'
      - 'docs/governance/**'
      - 'AGENTS.md'
      - 'helm/**'
      - '.github/workflows/infra-operations.yml'
      - '.github/workflows/terraform-*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate configurations without backend or AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/modules/state-bucket infra/bootstrap infra/environments/dev infra/modules/network infra/modules/registry infra/modules/eks infra/environments/dev/platform infra/modules/data-services infra/environments/dev/data; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra/modules/state-bucket test
          for root in infra/modules/network infra/modules/registry infra/modules/eks infra/environments/dev/platform infra/modules/data-services infra/environments/dev/data; do
            terraform -chdir="$root" test
          done
          python -m unittest discover -s scripts/bootstrap/tests -v
          python -m unittest discover -s scripts/governance/tests -v
          python -m pip install -r scripts/infra/requirements.txt
          python -m unittest discover -s scripts/infra/tests -v
      - name: Install checksum-pinned Helm and workflow validation tools
        run: python scripts/deploy/install-tools.py
      - name: Validate infrastructure and application workflows
        run: |
          actionlint -config-file scripts/deploy/actionlint.yaml .github/workflows/infra-operations.yml .github/workflows/terraform-validation.yml .github/workflows/terraform-operations.yml .github/workflows/branch-governance.yml .github/workflows/app-ci.yml .github/workflows/app-validation.yml .github/workflows/app-publish.yml .github/workflows/app-deploy.yml
      - name: Helm lint, rendering and workload safety tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts/deploy/tests -v
      - name: Checkov static scan
        run: |
          python -m pip install checkov==3.3.17
          checkov --directory infra --framework terraform --download-external-modules false
