name: Application validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dotnet:
    name: .NET restore build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: dotnet restore BankingReleasePlatform.sln --locked-mode
      - run: dotnet build BankingReleasePlatform.sln -c Release --no-restore
      - run: dotnet test BankingReleasePlatform.sln -c Release --no-build --logger trx --results-directory artifacts/application/test-results
      - name: Offline PostgreSQL, SQS and application recovery integration
        run: python scripts/deploy/data-integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dotnet-test-results
          path: |
            artifacts/application/test-results
            artifacts/application/data-integration
          retention-days: 30
  helm:
    name: Helm schema and deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/deploy/requirements.txt
      - run: python scripts/deploy/install-tools.py
      - run: python -m unittest discover -s scripts/deploy/tests -v
      - run: python scripts/deploy/validate-chart.py
      - run: python scripts/deploy/validate-monitoring.py
      - run: actionlint -config-file scripts/deploy/actionlint.yaml .github/workflows/app-ci.yml .github/workflows/app-validation.yml .github/workflows/app-publish.yml .github/workflows/app-deploy.yml
  containers:
    name: Container integration and Trivy security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build images once
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/deploy/build.py --commit "$SOURCE_COMMIT"
      - run: python scripts/deploy/docker-smoke.py
      - run: python scripts/deploy/scan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-images
          path: artifacts/application/scanned
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-reports
          path: artifacts/application/scanned/reports
          retention-days: 30
  aggregate:
    name: Application CI
    if: always()
    needs: [dotnet, helm, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          DOTNET: ${{ needs.dotnet.result }}
          HELM: ${{ needs.helm.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: test "$DOTNET" = success && test "$HELM" = success && test "$CONTAINERS" = success
