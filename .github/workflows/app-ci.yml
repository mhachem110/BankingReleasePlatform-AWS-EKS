# App CI remains credential-free: restore/audit, build, Helm safety and Trivy.
# Keep the existing check names so branch protection continues to recognize them.
name: Application CI
on:
  pull_request:
    branches: [dev, stage, uat, main]
  push:
    branches: [feature/app, dev, stage, uat, main]
permissions:
  contents: read
concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/app-validation.yml
