name: Reviewed Banking project cleanup
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [vpc-seed, policy-prerequisites, iam-prerequisites]
        default: vpc-seed
        description: 'Only the verified test VPC, unused project policies or unused project service roles'
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        description: 'Destroy plan only by default; apply requires a second bootstrap review'
      approval:
        type: string
        default: ''
        description: 'Apply only: DESTROY-REVIEWED-BANKING- followed by the uppercase target'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.target == 'vpc-seed' && 'banking-dev-platform' || 'banking-shared-iam-prerequisites' }}
  cancel-in-progress: false
env:
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
jobs:
  prerequisites:
    if: github.ref == 'refs/heads/dev' && vars.CLEANUP_ENABLED == 'true' && vars.AWS_OPERATIONS_ENABLED == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bootstrap/check-github-environment.py
  plan:
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
    env: &cleanup-env
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_OPERATIONS_ENABLED: ${{ vars.AWS_OPERATIONS_ENABLED }}
      CLEANUP_ENABLED: ${{ vars.CLEANUP_ENABLED }}
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      NETWORK_SEED_REVIEW_JSON: ${{ vars.NETWORK_SEED_REVIEW_JSON }}
      TARGET: ${{ inputs.target }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python -m pip install -r scripts/infra/requirements.txt
      - id: config
        run: python scripts/infra/cleanup_guard.py inputs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-cleanup-plan
          inline-session-policy: ${{ steps.config.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Inspect native state and save the exact destroy plan
        shell: bash
        run: |
          set -euo pipefail
          root=infra/cleanup
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/cleanup.tfbackend.json"
          [[ "$(terraform -chdir="$root" workspace show)" == default ]]
          terraform -chdir="$root" validate
          terraform -chdir="$root" state pull > cleanup-state.json
          python scripts/infra/cleanup_guard.py preflight
          terraform -chdir="$root" plan -destroy -input=false -lock-timeout=5m -out="$GITHUB_WORKSPACE/cleanup.tfplan"
          terraform -chdir="$root" show -json "$GITHUB_WORKSPACE/cleanup.tfplan" > cleanup-plan.json
          python scripts/infra/cleanup_guard.py plan
          terraform -chdir="$root" show -no-color "$GITHUB_WORKSPACE/cleanup.tfplan" > cleanup-plan.txt
      - id: hash
        shell: bash
        run: echo "digest=$(sha256sum cleanup.tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-cleanup-reviewed-plan
          path: |
            cleanup.tfplan
            cleanup.tfbackend.json
            cleanup-config.json
            cleanup-plan-review.json
            cleanup-state-review.json
            cleanup-plan.txt
            cleanup-preflight.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish destroy review instructions
        run: |
          echo 'Review cleanup-plan.txt, cleanup-plan-review.json, saved SHA256, exact selected inventory, ownership and live dependencies before approving apply. Only the verified VPC seed, unused project policies or unused project service roles may be deleted. Backend and unrelated/shared IAM remain intact.' >> "$GITHUB_STEP_SUMMARY"
  apply:
    if: inputs.operation == 'apply' && ((inputs.target == 'vpc-seed' && inputs.approval == 'DESTROY-REVIEWED-BANKING-VPC-SEED') || (inputs.target == 'policy-prerequisites' && inputs.approval == 'DESTROY-REVIEWED-BANKING-POLICY-PREREQUISITES') || (inputs.target == 'iam-prerequisites' && inputs.approval == 'DESTROY-REVIEWED-BANKING-IAM-PREREQUISITES'))
    needs: [prerequisites, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
      actions: read
    env: *cleanup-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python -m pip install -r scripts/infra/requirements.txt
      - id: config
        run: python scripts/infra/cleanup_guard.py inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banking-cleanup-reviewed-plan
          path: reviewed
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-cleanup-inspect
          inline-session-policy: ${{ steps.config.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Recheck current state and the same-run saved plan
        env:
          REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
        run: |
          set -euo pipefail
          root=infra/cleanup
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/cleanup.tfbackend.json"
          [[ "$(terraform -chdir="$root" workspace show)" == default ]]
          terraform -chdir="$root" state pull > cleanup-state.json
          python scripts/infra/cleanup_guard.py preflight
          terraform -chdir="$root" show -json "$GITHUB_WORKSPACE/reviewed/cleanup.tfplan" > cleanup-plan.json
          python scripts/infra/cleanup_guard.py saved
      - id: delete-cap
        run: python scripts/infra/cleanup_guard.py delete-cap
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: banking-cleanup-apply
          inline-session-policy: ${{ steps.delete-cap.outputs.session_policy }}
          unset-current-credentials: true
          translate-env-variables: false
      - name: Apply only the reviewed saved destroy plan and verify AWS absence
        run: |
          set -euo pipefail
          python scripts/infra/cleanup_guard.py preflight
          terraform -chdir=infra/cleanup apply -input=false -lock-timeout=5m "$GITHUB_WORKSPACE/reviewed/cleanup.tfplan"
          terraform -chdir=infra/cleanup state pull > cleanup-state.json
          python scripts/infra/cleanup_guard.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banking-cleanup-verification
          path: cleanup-verification.json
          retention-days: 7
          if-no-files-found: error
