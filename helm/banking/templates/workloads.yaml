{{- if or (ne .Values.resources.requests.cpu .Values.resources.limits.cpu) (ne .Values.resources.requests.memory .Values.resources.limits.memory) }}
{{- fail "Fargate requires equal CPU/memory requests and limits" }}
{{- end }}
{{- if gt .Values.autoscaling.minReplicas .Values.autoscaling.maxReplicas }}
{{- fail "autoscaling.minReplicas must not exceed maxReplicas" }}
{{- end }}
{{- if and .Values.demonstration.failPaymentReadiness (or (not .Values.demonstration.enabled) (ne .Release.Namespace "banking-dev")) }}
{{- fail "Fault injection requires demonstration.enabled and banking-dev" }}
{{- end }}
{{- if and .Values.persistence.enabled (or (not .Values.persistence.accountSecretName) (not .Values.persistence.paymentSecretName) (not .Values.persistence.caConfigMapName)) }}
{{- fail "Persistence requires existing operator-managed account/payment Secrets and CA ConfigMap" }}
{{- end }}
{{- if and .Values.messaging.enabled (or (not .Values.messaging.approved) (not .Values.persistence.enabled) (not (has .Release.Namespace (list "banking-dev" "banking-prod"))) (ne .Values.messaging.roleArn (printf "arn:aws:iam::866934333672:role/cloudbatch818-mahmoud-banking-payment-runtime-%s" (trimPrefix "banking-" .Release.Namespace))) (ne .Values.messaging.queueUrl (printf "https://sqs.us-east-2.amazonaws.com/866934333672/%s-payments" .Release.Namespace)) (ne .Values.messaging.deadLetterQueueUrl (printf "https://sqs.us-east-2.amazonaws.com/866934333672/%s-payments-dlq" .Release.Namespace))) }}
{{- fail "Messaging requires approved namespace-bound IRSA, persistence and exact project queues" }}
{{- end }}
{{- if and .Values.messaging.enabled (eq .Values.messaging.queueUrl .Values.messaging.deadLetterQueueUrl) }}
{{- fail "Messaging source and dead-letter queues must be distinct" }}
{{- end }}
{{- range $service := list "account" "payment" }}
{{- $image := index $.Values.images $service }}
{{- $metadata := dict "root" $ "service" $service "digest" $image.digest }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
    {{- if and (eq $service "payment") $.Values.messaging.enabled }}
    eks.amazonaws.com/role-arn: {{ $.Values.messaging.roleArn | quote }}
    {{- end }}
automountServiceAccountToken: {{ and (eq $service "payment") $.Values.messaging.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ default $.Values.replicaCount (index $.Values.replicas $service) }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $service }}}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $service }}
        {{- include "banking.labels" $metadata | nindent 8 }}
      annotations:
        {{- include "banking.annotations" $metadata | nindent 8 }}
        {{- if $.Values.monitoring.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        {{- end }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $service }}
      automountServiceAccountToken: {{ and (eq $service "payment") $.Values.messaging.enabled }}
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $service }}
          image: "{{ required "Supply an ECR image repository" $image.repository }}@{{ required "Supply an immutable sha256 image digest" $image.digest }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: ASPNETCORE_HTTP_PORTS, value: "8080"}
            - {name: ASPNETCORE_ENVIRONMENT, value: "Production"}
            {{- if $.Values.persistence.enabled }}
            - {name: Persistence__Mode, value: Postgres}
            - {name: Persistence__ConnectionStringFile, value: /etc/banking/database/connectionString}
            {{- end }}
            {{- if eq $service "payment" }}
            - {name: AccountApi__BaseUrl, value: "http://{{ $.Release.Name }}-account.{{ $.Release.Namespace }}.svc.cluster.local:8080/"}
            {{- if $.Values.messaging.enabled }}
            - {name: Messaging__Enabled, value: "true"}
            - {name: Messaging__ExpectedAccountId, value: "866934333672"}
            - {name: Messaging__QueueUrl, value: {{ $.Values.messaging.queueUrl | quote }}}
            - {name: Messaging__DeadLetterQueueUrl, value: {{ $.Values.messaging.deadLetterQueueUrl | quote }}}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ if and (eq $service "payment") $.Values.demonstration.failPaymentReadiness }}/demonstration-not-found{{ else if $.Values.persistence.enabled }}/ready{{ else }}/health{{ end }}
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            {{- if $.Values.persistence.enabled }}
            - {name: database, mountPath: /etc/banking/database, readOnly: true}
            - {name: database-ca, mountPath: /etc/banking/ca, readOnly: true}
            {{- end }}
      volumes:
        - {name: temporary, emptyDir: {sizeLimit: 64Mi}}
        {{- if $.Values.persistence.enabled }}
        - name: database
          secret:
            secretName: {{ if eq $service "account" }}{{ $.Values.persistence.accountSecretName }}{{ else }}{{ $.Values.persistence.paymentSecretName }}{{ end }}
            defaultMode: 0440
            items: [{key: connectionString, path: connectionString}]
        - name: database-ca
          configMap:
            name: {{ $.Values.persistence.caConfigMapName }}
            items: [{key: root-ca.pem, path: root-ca.pem}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: {{ $.Release.Name }}-{{ $service }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $service }}}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $service }}}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
