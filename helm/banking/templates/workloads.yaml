{{- if or (ne .Values.resources.requests.cpu .Values.resources.limits.cpu) (ne .Values.resources.requests.memory .Values.resources.limits.memory) }}
{{- fail "Fargate requires equal CPU/memory requests and limits" }}
{{- end }}
{{- if gt .Values.autoscaling.minReplicas .Values.autoscaling.maxReplicas }}
{{- fail "autoscaling.minReplicas must not exceed maxReplicas" }}
{{- end }}
{{- if and .Values.demonstration.failPaymentReadiness (or (not .Values.demonstration.enabled) (ne .Release.Namespace "banking-dev")) }}
{{- fail "Fault injection requires demonstration.enabled and banking-dev" }}
{{- end }}
{{- range $service := list "account" "payment" }}
{{- $image := index $.Values.images $service }}
{{- $metadata := dict "root" $ "service" $service "digest" $image.digest }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ default $.Values.replicaCount (index $.Values.replicas $service) }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $service }}}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $service }}
        {{- include "banking.labels" $metadata | nindent 8 }}
      annotations:
        {{- include "banking.annotations" $metadata | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $service }}
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $service }}
          image: "{{ required "Supply an ECR image repository" $image.repository }}@{{ required "Supply an immutable sha256 image digest" $image.digest }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: ASPNETCORE_HTTP_PORTS, value: "8080"}
            - {name: ASPNETCORE_ENVIRONMENT, value: "Production"}
            {{- if eq $service "payment" }}
            - {name: AccountApi__BaseUrl, value: "http://{{ $.Release.Name }}-account.{{ $.Release.Namespace }}.svc.cluster.local:8080/"}
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ if and (eq $service "payment") $.Values.demonstration.failPaymentReadiness }}/demonstration-not-found{{ else }}/health{{ end }}
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $service }}
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: {{ $.Release.Name }}-{{ $service }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $service }}}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "banking.labels" $metadata | nindent 4 }}
  annotations:
    {{- include "banking.annotations" $metadata | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $service }}}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
