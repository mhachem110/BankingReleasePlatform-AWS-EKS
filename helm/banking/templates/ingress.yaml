{{- if .Values.ingress.enabled }}
{{- if not .Values.ingressSourceCidrs }}
{{- fail "ALB requires approved source subnet CIDRs for NetworkPolicy" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "Supply the approved ACM certificate ARN" .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "Supply the approved HTTPS host" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/accounts
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-account, port: {number: 8080}}
          - path: /api/payments
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-payment, port: {number: 8080}}
{{- end }}
